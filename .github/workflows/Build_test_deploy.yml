name: Build-Test-Deploy

on:
  push:
    branches: [ "main", "feature/HomeScreen" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'

      - name: Build
        run: mvn clean package -DskipTests

      # 🔥 ADD ARTIFACT HERE
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamehub-jar
          path: target/*.jar

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: mvn test || true

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker
        run: docker build -t lincomycin/websitegamehub:latest .

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Docker
        run: docker push lincomycin/websitegamehub:latest