name: CI/CD Docker

on:
  push:
    branches: [ "main", "feature/HomeScreen" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build
        run: mvn clean package -DskipTests

      - name: Test
        run: mvn test || true

      - name: Build Docker
        run: docker build -t lincomycin/websitegamehub:latest .

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Docker
        run: docker push lincomycin/websitegamehub:latest